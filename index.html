<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Athar: property marketplace and management platform where every home has a verified history. Demo build.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Athar Property Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Young+Serif&display=swap">
<style>
/* Layout: sticky two-row header (brand + tabs), single content column up to 1200px; listing page = gallery/content left, sticky cost panel right */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#ECEEF1; --ink:#15181E; --muted:#5B6370; --line:#DFE2E7;
  --accent:#8A1538; --accent-ink:#FFFFFF; --accent-soft:#F6E7EC; --accent-text:#7A1231;
  --ok:#1D7454; --ok-soft:#E3F2EB; --warn:#9A6212; --warn-soft:#FBF0DD; --bad:#B42318; --bad-soft:#FBE6E4;
  --plate:#1C4C8C; --plate-ink:#FFFFFF;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --hdr-h:112px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#191C22; --sunk:#22262D; --ink:#ECEEF1; --muted:#9BA3AE; --line:#2B3038;
  --accent:#E06A8C; --accent-ink:#1A0910; --accent-soft:#3A1824; --accent-text:#F08AA6;
  --ok:#52C796; --ok-soft:#173326; --warn:#E5A84A; --warn-soft:#3A2B12; --bad:#F27B6F; --bad-soft:#3D1A17;
  --plate:#2F65AE; --plate-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191C22; --sunk:#22262D; --ink:#ECEEF1; --muted:#9BA3AE; --line:#2B3038;
  --accent:#E06A8C; --accent-ink:#1A0910; --accent-soft:#3A1824; --accent-text:#F08AA6;
  --ok:#52C796; --ok-soft:#173326; --warn:#E5A84A; --warn-soft:#3A2B12; --bad:#F27B6F; --bad-soft:#3D1A17;
  --plate:#2F65AE; --plate-ink:#FFFFFF; color-scheme:dark}
:root[lang="ar"]{--f-display:"IBM Plex Sans Arabic", Tahoma, sans-serif; --f-body:"IBM Plex Sans Arabic", Tahoma, "Segoe UI", sans-serif}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
h1{font-family:var(--f-display);font-size:clamp(26px,3.6vw,36px);line-height:1.15;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:22px;line-height:1.25}
h3{font-size:15px;font-weight:600}
:root[lang="ar"] h1,:root[lang="ar"] h2{font-weight:600;letter-spacing:0}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
:root[lang="ar"] .label{letter-spacing:0;text-transform:none;font-size:12.5px}

/* header */
header.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:24px;letter-spacing:-.01em;line-height:1}
.brand span{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:17px;color:var(--accent-text);font-weight:600}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.demo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn-lang{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500}
.btn-lang:hover{border-color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px 12px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:28px 48px}
footer{border-top:1px solid var(--line);padding-block:20px;font-size:13px;color:var(--muted)}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 16px;font-size:14.5px;font-weight:500;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:500;color:var(--muted)}
select,input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14.5px;min-width:0;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:500}

/* explore */
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:24px}
.intro p{color:var(--muted);max-width:56ch;margin-top:10px;font-size:16px}
.filters{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.filters .seg{align-self:end;height:40px;align-items:center}
.count{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:start;padding:0;transition:transform .15s ease,border-color .15s ease}
.card:hover{border-color:var(--muted);transform:translateY(-2px)}
.card .art{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--sunk)}
.art svg{display:block;width:100%;height:100%}
.art .badges{position:absolute;inset:10px 10px auto 10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.92);color:#15181E}
.badge.ok svg{color:#1D7454}
.score-chip{background:#8A1538;color:#fff}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:15.5px;line-height:1.35}
.specs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.price-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px;flex-wrap:wrap}
.price{font-size:17px;font-weight:600}
.price small{font-size:12.5px;font-weight:400;color:var(--muted)}
.tm{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-text);border-radius:8px;padding:7px 10px;font-size:13px;margin-top:6px}
.tm b{font-size:14px}
.commute{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.commute svg{flex:none}

/* listing */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--muted);font-size:14px;margin-bottom:16px}
.back:hover{color:var(--ink)}
:root[dir="rtl"] .back svg{transform:scaleX(-1)}
.lv{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"g s" "h s" "p s";gap:24px 32px;align-items:start}
.lv-g{grid-area:g;min-width:0}.lv-h{grid-area:h;min-width:0}.lv-p{grid-area:p;min-width:0}
.lv-s{grid-area:s;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h) + 16px);display:flex;flex-direction:column;gap:14px}
.hero-art{border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:var(--sunk)}
.hero-art svg{width:100%;height:100%;display:block}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumbs button{flex:1;max-width:120px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--sunk)}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs svg{width:100%;height:100%;display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.acc{background:var(--accent-soft);color:var(--accent-text)}
.plate{display:inline-flex;align-items:stretch;border-radius:7px;overflow:hidden;background:var(--plate);color:var(--plate-ink);font-size:12.5px;margin-top:12px;border:2px solid var(--plate)}
.plate span{padding:4px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.plate span+span{border-inline-start:1px solid rgba(255,255,255,.4)}
.plate small{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.plate b{font-family:var(--f-mono);font-size:15px;font-weight:500}
.lv-h .specs{font-size:14.5px;margin-top:12px}
.lv-h p.desc{margin-top:12px;max-width:62ch;font-size:15.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.big-price{font-size:26px;font-weight:600;letter-spacing:-.01em}
.big-price small{font-size:14px;color:var(--muted);font-weight:400}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:12px 0 14px;background:var(--sunk)}
.stack i{display:block;height:100%;background:var(--accent)}
.rows{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.rows .r{display:flex;justify-content:space-between;gap:12px;align-items:center}
.rows .r>span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.sw{width:10px;height:10px;border-radius:3px;background:var(--accent);flex:none}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-weight:600}
.total b{font-size:20px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;font-size:12.5px}
.slots button:hover{border-color:var(--accent)}
.confirm{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:500;margin-top:10px}

/* unit passport */
.pp{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pp-head{display:flex;gap:18px;align-items:center;padding:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pp-head .t{flex:1;min-width:220px}
.pp-head p{color:var(--muted);font-size:14px;margin-top:4px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:600;line-height:1}
.ring b small{font-size:9.5px;font-weight:500;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.verified{display:flex;gap:8px;align-items:flex-start;padding:12px 20px;background:var(--ok-soft);color:var(--ok);font-size:13.5px;font-weight:500}
.verified svg{flex:none;margin-top:2px}
.pp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pp-sec{padding:20px;min-width:0}
.pp-sec+.pp-sec{border-inline-start:1px solid var(--line)}
.pp-grid+.pp-grid{border-top:1px solid var(--line)}
.pp-sec h3{margin-bottom:14px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:62px 14px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.tl li::after{content:"";position:absolute;inset-inline-start:78px;top:14px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li:last-child{padding-bottom:0}
.tl .d{font-size:12px;color:var(--muted);padding-top:1px}
.tl .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--surface);border:2px solid var(--accent);margin-inline-start:2px}
.tl .dot.v{background:var(--ok);border-color:var(--ok)}
.tl .w b{font-weight:600;font-size:14px;display:block}
.tl .w span{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat b{display:block;font-size:20px;font-weight:600}
.stat span{font-size:12.5px;color:var(--muted)}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.hist li{display:flex;gap:10px;align-items:flex-start}
.hist li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);margin-top:8px;flex:none}

/* page heads */
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.phead p{color:var(--muted);max-width:62ch;margin-top:8px;font-size:15.5px}

/* deal room */
.deal-top{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
.deal-top .field{width:min(100%,380px)}
.deal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.lim{display:flex;flex-direction:column;gap:14px}
.lim h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lim .lock{font-size:11.5px;font-weight:500;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.lim .field>span{display:flex;justify-content:space-between;gap:8px}
.lim output{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.side-o{border-top:3px solid var(--muted)}
.side-t{border-top:3px solid var(--accent)}
.transcript{display:flex;flex-direction:column;gap:10px;min-height:280px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:14px;animation:pop .25s ease both}
.msg small{display:block;font-size:11.5px;font-weight:600;margin-bottom:2px;opacity:.75}
.msg.o{align-self:flex-start;background:var(--sunk);border-end-start-radius:4px}
.msg.t{align-self:flex-end;background:var(--accent-soft);color:var(--accent-text);border-end-end-radius:4px}
.msg.sys{align-self:center;max-width:100%;background:var(--ok-soft);color:var(--ok);text-align:center;font-weight:500}
.msg.fail{background:var(--warn-soft);color:var(--warn)}
@keyframes pop{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
.idle{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;margin:auto 0}
.typing{align-self:center;font-size:12.5px;color:var(--muted)}
.result{margin-top:16px;border:1px solid var(--ok);border-radius:12px;padding:16px;background:var(--surface)}
.result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 14px}
.result-grid div b{display:block;font-size:19px;font-weight:600}
.result-grid div span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* home wish */
.wish-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.wish-form{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.wishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.wish{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.wish.mine{border-color:var(--accent)}
.wish .who{display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.wish.mine .av{background:var(--accent);color:var(--accent-ink)}
.wish .who b{display:block;font-size:14.5px}
.wish .who span{font-size:12px;color:var(--muted)}
.wish .budget{font-size:18px;font-weight:600}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{font-size:12px;background:var(--sunk);border-radius:6px;padding:3px 8px}
.match{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto;font-size:13px}
.match .yes{color:var(--ok);font-weight:600}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-text);font-weight:600;font-size:13px}

/* rent passport */
.rp{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.idcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.idcard .who{display:flex;gap:12px;align-items:center}
.idcard .av{width:48px;height:48px;font-size:18px;background:var(--accent);color:var(--accent-ink)}
.gauge{width:100%;max-width:260px;margin:0 auto;display:block}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.facts div span{display:block;font-size:12px;color:var(--muted)}
.facts div b{font-size:14.5px;font-weight:600}
.paygrid-wrap{overflow-x:auto}
.paygrid{display:grid;grid-template-columns:44px repeat(12,minmax(26px,1fr));gap:4px;min-width:420px;font-size:11px}
.paygrid .yl{color:var(--muted);display:flex;align-items:center;font-variant-numeric:tabular-nums}
.paygrid .ml{color:var(--muted);text-align:center}
.cell{aspect-ratio:1;border-radius:4px;background:var(--ok)}
.cell.late{background:var(--warn)}
.cell.none{background:var(--sunk)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.benefits{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.benefits li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.benefits svg{flex:none;color:var(--ok);margin-top:2px}

/* owner */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi b{display:block;font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.owner-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:0 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td b{font-weight:600;display:block}
td small{color:var(--muted);font-size:12px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.acc{background:var(--accent-soft);color:var(--accent-text)}
.st.mute{background:var(--sunk);color:var(--muted)}
.switch{width:40px;height:23px;border-radius:12px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:inset-inline-start .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:20px}
.steps{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;counter-reset:s}
.steps li{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.steps li::before{content:"";height:5px;border-radius:3px;background:var(--sunk)}
.steps li.done::before{background:var(--ok)}
.steps li.now::before{background:var(--accent)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.done{color:var(--ink)}
.chq{display:flex;flex-direction:column}
.chq .r{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.chq .r:last-child{border-bottom:0}
.mt{display:flex;flex-direction:column;gap:12px}
.mt .r{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mt .r b{display:block;font-size:14px}
.mt .r span{font-size:12.5px;color:var(--muted)}

/* move-out */
.mo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.mo figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mo figure svg{display:block;width:100%;height:auto}
.mo figcaption{padding:10px 14px;font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line)}
.mo-bottom{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.finds{display:flex;flex-direction:column}
.find{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:0}
.find .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.find b{display:block;font-size:14.5px;font-weight:600}
.find .amt{font-weight:600;white-space:nowrap;font-size:14px}
.find .amt.zero{color:var(--muted);font-weight:500}
.settle .rows{font-size:14.5px}
.banner{border-radius:10px;padding:12px 14px;font-size:14px;font-weight:500;margin-top:14px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;max-width:calc(100% - 32px);width:max-content}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* property management */
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:20px;padding-bottom:2px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--muted)}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.props{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}
.prop{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.prop:hover{border-color:var(--muted)}
.prop[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prop b{font-size:15.5px;font-weight:600}
.prop span{font-size:12.5px;color:var(--muted)}
.bldg-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.bldg{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.floor{display:grid;grid-template-columns:62px repeat(var(--per),minmax(64px,1fr));gap:6px}
.floor .fl{font-size:12px;color:var(--muted);display:flex;align-items:center}
.roof{height:8px;border-radius:6px 6px 0 0;background:var(--line);margin-inline-start:68px}
.u{border:1px solid transparent;border-radius:8px;padding:8px;min-height:60px;text-align:start;display:flex;flex-direction:column;justify-content:space-between;gap:4px;font-size:11.5px;background:var(--surface)}
.u b{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.u.occupied{background:var(--ok-soft);color:var(--ink)}
.u.vacant{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.u.notice{background:var(--warn-soft);color:var(--ink)}
.u.maint{background:var(--sunk);border:1px dashed var(--muted);color:var(--muted)}
.u[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.u .owe{color:var(--bad);font-weight:600}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend2 i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:6px}
.kv{display:flex;flex-direction:column;gap:10px;font-size:14px}
.kv .r{display:flex;justify-content:space-between;gap:12px}
.kv .r span:first-child{color:var(--muted)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.lane{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lane h3{display:flex;justify-content:space-between;font-size:13px;padding:2px 4px}
.wo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.wo .top2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.wo b{font-size:14px;font-weight:600}
.wo .late{color:var(--bad);font-weight:600}
.pm-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;margin-bottom:16px}
.aging{display:flex;flex-direction:column;gap:12px}
.aging .r{display:grid;grid-template-columns:76px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px}
.aging .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.aging .track i{display:block;height:100%;background:var(--warn)}
.aging .r:last-child .track i{background:var(--bad)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
.two-col{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ledger .r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger .r:last-child{border-bottom:0}
.neg{color:var(--bad)}

@media (max-width:1000px){
  .kanban{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bldg-wrap{grid-template-columns:minmax(0,1fr)}
  .deal{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .deal .tr-panel{grid-column:1/-1;order:3}
  .owner-grid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .lv{grid-template-columns:minmax(0,1fr);grid-template-areas:"g" "h" "s" "p"}

  .wish-layout,.rp{grid-template-columns:minmax(0,1fr)}
  .mo-bottom{grid-template-columns:minmax(0,1fr)}
  .benefits{grid-template-columns:minmax(0,1fr)}
  .two-col{grid-template-columns:minmax(0,1fr)}
  .pm-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

  .mo{grid-template-columns:minmax(0,1fr)}

  .filters{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:12px}
  .pill.demo{display:none}
  .kpi b{font-size:22px}
  .props{grid-template-columns:minmax(0,1fr)}
  .kanban{grid-template-columns:minmax(0,1fr)}
  .pm-form{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function limDefaults(l){const p=l.price;return {oFloor:r50(p*.94),oCheq:4,oFree:15,tIdeal:r50(p*.86),tMax:r50(p*.97),tCheq:6,tFree:30}}
function negotiate(d,l){
 const msgs=[],ask=l.price;let o=ask,tt=d.tIdeal;
 msgs.push(['o','m_open_o',{x:money(o),c:d.oCheq}]);
 msgs.push(['t','m_open_t',{x:money(tt),c:d.tCheq}]);
 if(d.oFloor>d.tMax){msgs.push(['fail','m_nodeal',{gap:money(d.oFloor-d.tMax)}]);return {msgs,res:null}}
 let r=0;
 while(o-tt>150&&r<6){r++;o=Math.max(d.oFloor,r50(o-(o-d.oFloor)*.45));tt=Math.min(d.tMax,r50(tt+(d.tMax-tt)*.45));msgs.push(['o','m_counter_o',{x:money(o)}]);if(o-tt>150)msgs.push(['t','m_counter_t',{x:money(tt)}]);}
 let price=clamp(r50((o+tt)/2),d.oFloor,d.tMax);
 let cheq=d.tCheq;
 if(d.tCheq>d.oCheq){cheq=d.oCheq;const disc=Math.min(150*(d.tCheq-d.oCheq),Math.floor((price-d.oFloor)/50)*50);msgs.push(['o','m_cheq_o',{c:d.oCheq}]);
  if(disc>0){price-=disc;msgs.push(['t','m_cheq_t',{c:d.oCheq,x:money(disc)}]);msgs.push(['o','m_cheq_ok',{}]);}}
 const free=Math.min(d.tFree,d.oFree);
 msgs.push(['o','m_free',{f:free}]);
 msgs.push(['sys','m_agreed',{}]);
 const save=(ask-price)*12+price*12/365*free;
 return {msgs,res:{price,cheq,free,save}};
}

 </div>
 ${D&&!D.running&&D.res?`<div class="result"><h2>${t('res_title')}</h2><div class="result-grid">

function transcriptHTML(){
 const D=S.deal;if(!D)return `<div class="idle">${t('deal_idle')}</div>`;
 const who={o:'a_o',t:'a_t',sys:'a_sys',fail:'a_sys'};

function runDeal(){
 const l=byId(S.dealLid);const {msgs,res}=negotiate(S.lim,l);const gen=++S.dealGen;
 S.deal={msgs,res,shown:reduce()?msgs.length:1,running:!reduce()};render();
 if(reduce())return;
 const tick=()=>{if(gen!==S.dealGen)return;S.deal.shown++;if(S.deal.shown>=msgs.length){S.deal.running=false;if(S.route==='deal')render();return}
  const el=$('#transcript');if(el&&S.route==='deal')el.innerHTML=transcriptHTML();setTimeout(tick,700)};
 setTimeout(tick,700);
}

/* ---------- render + events ---------- */
function render(){
 const r=S.route;const root=document.documentElement;root.lang=S.lang;root.dir=S.lang==='ar'?'rtl':'ltr';
 $('#hdr').innerHTML=header(r);
 let html;
 if(r.startsWith('listing-')){const l=byId(r.slice(8));html=l?listingView(l):exploreView()}
 else html=({explore:exploreView,wish:wishView,deal:dealView,passport:passportView,owner:ownerView,manage:pmView,moveout:moveoutView}[r]||exploreView)();
 $('#view').innerHTML=html;$('#foot').textContent=t('footer');
 const hh=$('#hdr').offsetHeight;if(hh)root.style.setProperty('--hdr-h',hh+'px');
}
function go(r){S.route=r;S.photo=0;S.slotsOpen=false;S.booked=null;try{history.replaceState(null,'','#'+r)}catch(e){}render();try{window.scrollTo(0,0)}catch(e){}}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id,v=a.dataset.v;
 switch(act){
  case 'nav':go(a.dataset.r);break;
  case 'open':go('listing-'+id);break;
  case 'role':S.role=v;savePrefs();go(v==='owner'?'owner':'explore');break;
  case 'lang':S.lang=S.lang==='en'?'ar':'en';savePrefs();render();break;
  case 'fmode':S.filters.mode=v;S.filters.budget='any';render();break;
  case 'photo':S.photo=+v;render();break;
  case 'slots':S.slotsOpen=!S.slotsOpen;render();break;
  case 'slot':S.booked=+v;render();toast(t('booked',{s:tr(SLOTS[+v])}));break;
  case 'save':if(S.saved.has(id)){S.saved.delete(id);toast(t('unsaved'))}else{S.saved.add(id);toast(t('saved'))}render();break;
  case 'preapp':toast(t('toast_preapp'));break;
  case 'todeal':if(S.dealLid!==id){S.dealLid=id;S.lim=null;S.deal=null;S.dealGen++}go('deal');break;
  case 'negotiate':runDeal();break;
  case 'toast':toast(t(a.dataset.k));break;
  case 'wmode':S.wishForm.mode=v;S.wishForm.budget=v==='buy'?1500000:10000;render();break;
  case 'warea':{const ar=S.wishForm.areas;const i=ar.indexOf(v);if(i>=0)ar.splice(i,1);else ar.push(v);a.setAttribute('aria-pressed',i<0);break}
  case 'woffer':{const w=S.wishes.find(x=>x.id===id);if(w){w.offered=true;render();toast(t('w_offered_t'))}break}
  case 'wsee':{const w=S.wishes.find(x=>x.id===id);if(w){S.filters={mode:w.mode,area:w.areas.length===1?w.areas[0]:'all',budget:'any'};go('explore')}break}
  case 'auto':{const u=S.units.find(x=>x.id===id);u.auto=!u.auto;render();toast(t(u.auto?'auto_on':'auto_off',{u:u.name}));break}
  case 'dispatch':{const m=S.maint.find(x=>x.id===id);m.done=true;render();toast(t('mt_toast'));break}
  case 'mo':S.moState=v;render();break;
 }
});
document.addEventListener('change',e=>{
 const el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
 if(b==='dest'){S.dest=el.value;savePrefs();render()}
 else if(b==='area'){S.filters.area=el.value;render()}
 else if(b==='budget'){S.filters.budget=el.value;render()}
 else if(b==='deallid'){S.dealLid=el.value;S.lim=null;S.deal=null;S.dealGen++;render()}
 else if(b==='mk'){S.moMarkers=el.checked;render()}
});
document.addEventListener('input',e=>{
 const el=e.target;if(!el.dataset||!el.dataset.lim)return;const k=el.dataset.lim;S.lim[k]=+el.value;
 const o=document.getElementById('o-'+k);if(o)o.textContent=el.dataset.money==='1'?money(+el.value):el.value;
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='wish-form')return;e.preventDefault();const f=S.wishForm;
 if(!f.areas.length){toast(t('w_need_areas'));return}
 f.budget=Math.max(0,+$('#wf-budget').value||0);f.beds=+$('#wf-beds').value;f.cheq=+$('#wf-cheq').value;f.move=$('#wf-move').value;f.pets=$('#wf-pets').checked;
 const w={id:'w'+Date.now(),who:'you',mode:f.mode,areas:f.areas.slice(),budget:f.budget,beds:f.beds,cheq:f.cheq,pets:f.pets,move:f.move,ago:0};
 S.wishes.unshift(w);render();toast(t('w_posted',{n:matches(w).length}));
});
window.addEventListener('resize',()=>{const hh=$('#hdr').offsetHeight;if(hh)document.documentElement.style.setProperty('--hdr-h',hh+'px')});
(function init(){const h=(location.hash||'').slice(1);const valid=['explore','wish','deal','passport','owner','manage','moveout'];
 S.route=valid.includes(h)||(h.startsWith('listing-')&&byId(h.slice(8)))?h:(S.role==='owner'?'owner':'explore');render()})();
</script>

</body>
</html>
